<svg width="970" height="200" viewBox="0 0 970 200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Conectores -->
  <line x1="140" y1="100" x2="215" y2="100" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="100" x2="420" y2="100" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="100" x2="625" y2="100" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755" y1="100" x2="830" y2="100" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1. Reporte ciudadano -->
  <g transform="translate(30,55)">
    <rect width="110" height="90" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="55" cy="30" r="14" fill="#6366F1"/>
    <rect x="41" y="48" width="28" height="20" rx="4" fill="#6366F1" opacity="0.6"/>
    <text x="55" y="82" font-size="11" fill="#3730A3" text-anchor="middle">Reporte</text>
  </g>

  <!-- 2. Thought (CoT) -->
  <g transform="translate(220,50)">
    <rect width="125" height="100" rx="14" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="9" fill="#2DD4BF"/>
    <circle cx="55" cy="22" r="6" fill="#2DD4BF" opacity="0.6"/>
    <circle cx="72" cy="34" r="4" fill="#2DD4BF" opacity="0.4"/>
    <text x="62" y="70" font-size="12" font-weight="600" fill="#0F766E" text-anchor="middle">Thought</text>
    <text x="62" y="86" font-size="10" fill="#0F766E" text-anchor="middle">(Chain-of-Thought)</text>
  </g>

  <!-- 3. Action -->
  <g transform="translate(425,50)">
    <rect width="125" height="100" rx="14" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
    <polygon points="62,20 78,42 62,64 46,42" fill="#F59E0B"/>
    <text x="62" y="80" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">Action</text>
    <text x="62" y="96" font-size="10" fill="#92400E" text-anchor="middle">clasifica</text>
  </g>

  <!-- 4. Observation + JSON validado -->
  <g transform="translate(630,45)">
    <rect width="125" height="110" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="30" y="18" width="65" height="46" rx="6" fill="none" stroke="#EF4444" stroke-width="2"/>
    <text x="62" y="38" font-size="9" fill="#B91C1C" text-anchor="middle" font-family="monospace">{ }</text>
    <text x="62" y="53" font-size="7" fill="#B91C1C" text-anchor="middle" font-family="monospace">Pydantic ✓</text>
    <text x="62" y="88" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">Observation</text>
    <text x="62" y="103" font-size="10" fill="#B91C1C" text-anchor="middle">JSON validado</text>
  </g>

  <!-- 5. HITL -->
  <g transform="translate(835,50)">
    <rect width="120" height="100" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="60" cy="28" r="12" fill="#8B5CF6"/>
    <path d="M40,58 q20,-18 40,0 l0,14 -40,0 z" fill="#8B5CF6" opacity="0.85"/>
    <text x="60" y="86" font-size="11" font-weight="600" fill="#5B21B6" text-anchor="middle">Operador</text>
    <text x="60" y="100" font-size="10" fill="#5B21B6" text-anchor="middle">valida (HITL)</text>
  </g>
</svg>
